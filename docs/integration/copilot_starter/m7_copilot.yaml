# ---------------------------------------------------------------------------
# M7 — CVM Copilot                            (Ch 10 Unit 4 · Owner: E5)
#
# A LangChain agent that lets a non-technical marketing analyst interrogate the
# whole system in plain language. It makes six other modules legible to a
# non-technical audience in a single interaction.
# ---------------------------------------------------------------------------

llm:
  # Hosted inference, not self-hosted, to keep the runtime footprint at zero GPU.
  provider: ${oc.env:LLM_PROVIDER,groq}
  model: ${oc.env:LLM_MODEL,llama-3.3-70b-versatile}
  temperature: 0.0            # read-only agent; answers must be reproducible
  max_tokens: 1024
  timeout_seconds: 60

agent:
  type: tool_calling
  max_iterations: 6
  # Visible in the UI so evaluators can see it is grounded rather than
  # hallucinating. This is a demo requirement, not a debug flag.
  return_intermediate_steps: true
  verbose: true

tools:
  duckdb_sql:
    enabled: true
    database: ./data/processed/features_online.duckdb
    # READ-ONLY. Not a preference — a hard constraint.
    read_only: true
    forbidden_statements: [INSERT, UPDATE, DELETE, DROP, ALTER, CREATE, ATTACH, COPY]
    max_rows_returned: 5000
    timeout_seconds: 30

  model_api:
    enabled: true
    base_url: ${oc.env:CVM_API_URL,http://localhost:8000}
    allowed_endpoints:
      - /v1/score/churn
      - /v1/offer/next-best
      - /v1/price/quote
      - /v1/advance/limit
      - /v1/subscriber/{id}
      - /v1/network/site-risk
      - /v1/text/classify
    # The agent may READ decisions. It may not create or alter one.
    allow_write: false

  rag_retriever:
    # Descoping ladder step 2 removes this; the agent keeps SQL and model-API.
    enabled: true
    vector_store: chroma
    persist_directory: ./.chroma
    embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    top_k: 4
    # So the agent can explain WHY an offer was chosen.
    corpus:
      - docs/model_cards/
      - docs/data_dictionary.md
      - docs/architecture.md
      - conf/pricing.yaml
      - conf/advance.yaml

# --- Design constraints, stated explicitly and enforced in code -----------
constraints:
  # An LLM is not permitted anywhere in a path that moves money. All pricing
  # and credit decisions come from M3 and M4 under their guardrails; the agent
  # reads from the decision engine and explains.
  llm_never_sets_prices: true
  llm_never_sets_credit_limits: true
  llm_has_no_write_path: true
  # Every answer cites the tool output it came from. No ungrounded claims.
  require_citation_of_tool_output: true
  refuse_if_no_grounding: true

# Rehearsed for the demo. Also the integration test fixture.
scripted_demo_questions:
  - "Which Benghazi subscribers are at risk because of coverage, and what should we offer them?"
  - "What is our revenue at risk this month, and which three cell sites drive most of it?"
  - "Show me Platinum subscribers whose on-net ratio dropped more than 20% in 30 days."
  - "Why did subscriber <hash> get a 15 LYD advance limit instead of 25?"
