# ---------------------------------------------------------------------------
# MARKET FACTS — Almadar Aljadid, Libyan prepaid
#
# The product catalogue lives in conf/catalogue.yaml (real, operator-sourced).
# This file holds everything else the synthesis engine needs: recharge ladder,
# pay-as-you-go tariffs, base economics, calendar and geography.
#
# `status` on each block:
#   confirmed   — operator-sourced; `source:` names where
#   assumption  — our estimate, needs replacing or explicitly defending
#   placeholder — obviously fake, will break the demo if shipped
#
# Open questions: docs/MARKET_QUESTIONS.md
# ---------------------------------------------------------------------------

operator:
  status: confirmed
  name: Almadar Aljadid
  name_ar: "المدار الجديد"
  mcc: 606
  mnc: "01"
  parent: LPTIC
  # Libyana (MNC 00) is the competitor. Dual-SIM leakage flows toward them;
  # we do not price their catalogue.
  competitor:
    name: Libyana
    name_ar: "ليبيانا"
    mnc: "00"

currency:
  code: LYD
  symbol_ar: "د.ل."
  name_ar: "دينار ليبي"
  minor_unit: dirham
  minor_per_major: 1000
  # Prices below 1 LYD are real: the cheapest data bundle is 0.5 LYD.
  # Do not round monetary fields to whole dinars anywhere in the pipeline.

# ---------------------------------------------------------------------------
# 1. RECHARGE
# ---------------------------------------------------------------------------
recharge:
  status: confirmed
  source: "operator denominations supplied 2026-09-18"

  denominations_lyd: [3, 5, 10, 20, 40, 100]

  # Weighting is an ASSUMPTION -- the ladder is confirmed, the popularity split
  # is not. Weighted low because prepaid top-ups cluster at the bottom, and
  # because the cheapest bundles (0.5-3 LYD) are buyable off a 3 or 5 LYD card.
  denomination_weights:
    status: assumption
    values: [0.26, 0.28, 0.21, 0.13, 0.08, 0.04]

  bonus_on_recharge:
    status: assumption
    enabled: false
    tiers: []

  channels:
    status: assumption
    scratch_card:    { share: 0.45, available: true }
    agent_erecharge: { share: 0.30, available: true }
    almadar_app:     { share: 0.12, available: true }
    bank_card:       { share: 0.05, available: true }
    p2p_transfer:    { share: 0.08, available: true }

  # Confirmed indirectly: "Net fi Waqtuh" is recovered at first recharge OR at
  # an incoming balance transfer, so transfers-in are a settlement event and
  # must be modelled as such.
  transfer_in_settles_debt: true

  credit_expiry:
    status: assumption
    expires: false
    validity_days: null

# ---------------------------------------------------------------------------
# 2. PAY-AS-YOU-GO TARIFFS
# ---------------------------------------------------------------------------
# Still unknown. The catalogue covers bundles; it says nothing about what a
# subscriber pays with no bundle active. These set the baseline every bundle is
# a discount against.
payg:
  status: assumption      # ← Q2 in MARKET_QUESTIONS.md
  source: null
  voice_onnet_lyd_per_min: 0.06
  voice_offnet_lyd_per_min: 0.12
  voice_international_lyd_per_min: 1.50
  sms_onnet_lyd: 0.03
  sms_offnet_lyd: 0.06
  data_lyd_per_mb: 0.02
  voice_billing_increment_seconds: 60

# ---------------------------------------------------------------------------
# 3. CATALOGUE
# ---------------------------------------------------------------------------
catalogue:
  status: confirmed
  file: conf/catalogue.yaml
  source: Almadar/internet_offers_data_v4.csv
  # 57 bundles across 17 families. Predominantly data; the Mix and Family
  # families add voice minutes.
  notes:
    - "The off-peak product is عروض الصبح -- 06:00-11:00, MORNING not night."
    - "Volumes for most bundles are inferred from package names; confirm."
    - "variable_cost_lyd throughout the catalogue is an estimate, not operator data."

# ---------------------------------------------------------------------------
# 4. BASE AND ECONOMICS
# ---------------------------------------------------------------------------
base:
  status: assumption      # ← Q7
  source: "figures carried over from the project proposal, not operator-published"
  addressable_prepaid_subscribers: 1_000_000
  monthly_arpu_lyd: 12.0
  monthly_silent_churn_rate: 0.035
  prepaid_share_of_base: 0.95
  dual_sim_penetration: 0.60      # carrying both an Almadar and a Libyana SIM

# ---------------------------------------------------------------------------
# 5. CALENDAR
# ---------------------------------------------------------------------------
calendar:
  salary_week:
    status: assumption    # ← Q8
    day_of_month_start: 25
    day_of_month_end: 30
    recharge_multiplier: 1.8

  ramadan:
    status: assumption
    start: null           # YYYY-MM-DD for the modelling window
    end: null
    night_data_multiplier: 1.6
    daytime_voice_multiplier: 0.8

  daily_profile:
    # The 06:00-11:00 trough is CONFIRMED by the existence of عروض الصبح --
    # the operator priced its own spare capacity and told us when it is.
    # That is unusually strong evidence for an assumption of this kind.
    trough_hours: { status: confirmed, from: 6, to: 11, source: "عروض الصبح time condition" }
    peak_hours:   { status: assumption, values: [19, 20, 21, 22] }

  weekend_days:
    status: assumption
    values: [friday, saturday]

# ---------------------------------------------------------------------------
# 6. GEOGRAPHY
# ---------------------------------------------------------------------------
# District is a NETWORK-QUALITY context field only. conf/pricing.yaml forbids
# it as a pricing input and a redlining audit checks it stayed forbidden.
geography:
  status: assumption      # ← Q9

  districts:
    - { name: Tripoli,  name_ar: "طرابلس",  population_share: 0.30, urban: true }
    - { name: Benghazi, name_ar: "بنغازي",  population_share: 0.15, urban: true }
    - { name: Misrata,  name_ar: "مصراتة",  population_share: 0.09, urban: true }
    - { name: Zawiya,   name_ar: "الزاوية", population_share: 0.06, urban: true }
    - { name: Bayda,    name_ar: "البيضاء", population_share: 0.05, urban: true }
    - { name: Sabha,    name_ar: "سبها",    population_share: 0.04, urban: false }
    - { name: Tobruk,   name_ar: "طبرق",    population_share: 0.03, urban: true }
    - { name: Sirte,    name_ar: "سرت",     population_share: 0.03, urban: true }
    - { name: Ubari,    name_ar: "أوباري",  population_share: 0.02, urban: false }
    - { name: Ghat,     name_ar: "غات",     population_share: 0.01, urban: false }
    - { name: Other,    name_ar: "أخرى",    population_share: 0.22, urban: false }

  outage_severity_multiplier:
    status: assumption
    Sabha: 2.5
    Ubari: 2.8
    Ghat: 3.0
    Other: 1.6
    default: 1.0

# ---------------------------------------------------------------------------
# 7. LANGUAGE
# ---------------------------------------------------------------------------
language:
  status: assumption      # ← Q10
  default: ar
  distribution:
    ar: 0.55              # Modern Standard Arabic
    ar-LY: 0.38           # Libyan dialect
    ber: 0.04             # Amazigh / Tamazight
    en: 0.03
  # Arabic SMS is UCS-2 encoded: 70 characters, not 160. Offer copy that fits
  # in English will silently become two messages in Arabic.
  sms_max_chars_arabic: 70
  sms_max_chars_latin: 160
