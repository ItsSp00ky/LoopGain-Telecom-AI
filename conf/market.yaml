# ---------------------------------------------------------------------------
# MARKET FACTS — Almadar Aljadid, Libyan prepaid
#
# The product catalogue lives in conf/catalogue.yaml (real, operator-sourced).
# This file holds everything else the synthesis engine needs: recharge ladder,
# pay-as-you-go tariffs, base economics, calendar and geography.
#
# `status` on each block:
#   confirmed   — operator-sourced; `source:` names where
#   assumption  — our estimate, needs replacing or explicitly defending
#   placeholder — obviously fake, will break the demo if shipped
#
# Open questions: docs/MARKET_QUESTIONS.md
# ---------------------------------------------------------------------------

operator:
  status: confirmed
  name: Almadar Aljadid
  name_ar: "المدار الجديد"
  mcc: 606
  mnc: "01"
  parent: LPTIC
  # Libyana (MNC 00) is the competitor. Dual-SIM leakage flows toward them;
  # we do not price their catalogue.
  competitor:
    name: Libyana
    name_ar: "ليبيانا"
    mnc: "00"

currency:
  code: LYD
  symbol_ar: "د.ل."
  name_ar: "دينار ليبي"
  minor_unit: dirham
  minor_per_major: 1000
  # Prices below 1 LYD are real: the cheapest data bundle is 0.5 LYD.
  # Do not round monetary fields to whole dinars anywhere in the pipeline.

# ---------------------------------------------------------------------------
# 1. RECHARGE
# ---------------------------------------------------------------------------
recharge:
  status: confirmed
  source: "operator denominations supplied 2026-09-18"

  denominations_lyd: [5, 10, 20, 40, 100]

  # FIVE DINARS IS THE FLOOR. There is no smaller card, so 5 LYD is the
  # minimum price of getting back onto the network. That single fact does real
  # work downstream: it is exactly the size of the نت في وقته data advance,
  # which is why conf/advance.yaml treats the smallest card as the
  # affordability unit rather than as a rounding detail.
  #
  # Weighting is an ASSUMPTION -- the ladder is confirmed, the popularity split
  # is not. The bottom rung carries a large share because prepaid top-ups
  # cluster there and because the cheapest bundles (0.5-3 LYD) are bought off
  # the change from a 5 LYD card.
  denomination_weights:
    status: assumption
    values: [0.54, 0.21, 0.13, 0.08, 0.04]

  bonus_on_recharge:
    status: assumption
    enabled: false
    tiers: []

  channels:
    status: assumption
    scratch_card:    { share: 0.45, available: true }
    agent_erecharge: { share: 0.30, available: true }
    almadar_app:     { share: 0.12, available: true }
    bank_card:       { share: 0.05, available: true }
    p2p_transfer:    { share: 0.08, available: true }

  # Confirmed indirectly: "Net fi Waqtuh" is recovered at first recharge OR at
  # an incoming balance transfer, so transfers-in are a settlement event and
  # must be modelled as such.
  transfer_in_settles_debt: true

  credit_expiry:
    status: assumption
    expires: false
    validity_days: null

# ---------------------------------------------------------------------------
# 2. PAY-AS-YOU-GO TARIFFS
# ---------------------------------------------------------------------------
# What a subscriber pays with NO bundle active. This is the baseline every
# bundle is a discount against, and what makes bundle_vs_payg_share meaningful.
#
# Source: Almadar/Pay-as-you-go tariffs.md (operator-published, translated).
# Quoted there in dirham; 1000 dirham = 1 LYD.
payg:
  status: confirmed
  source: "Almadar/Pay-as-you-go tariffs.md"

  # ON-NET VOICE IS NOT A FLAT PER-MINUTE RATE.
  # 90 dirham buys the first 3 minutes as a block, then 50 dirham/min.
  # A 1-minute on-net call costs 0.090 LYD (effectively 0.090/min); a
  # 10-minute call costs 0.440 LYD (0.044/min). Short calls are expensive,
  # long calls are cheap. Generated minute distributions and any
  # revenue-per-minute feature must respect this -- flattening it to one rate
  # would misprice most of the base.
  voice_onnet:
    first_block_minutes: 3
    first_block_lyd: 0.090
    then_lyd_per_min: 0.050

  # Flat per-minute, and NOT far above the on-net marginal rate.
  voice_offnet_lyd_per_min: 0.090          # Almadar -> Libyana
  voice_landline_lyd_per_min: 0.040        # cheapest voice destination

  # NOT PUBLISHED in the source. Left null deliberately rather than guessed.
  # International voice is a small share of prepaid usage, so the pipeline
  # treats it as unavailable instead of inventing a number.
  voice_international_lyd_per_min: null

  # NO ON-NET SMS DISCOUNT -- both directions cost the same. SMS is therefore
  # not a competitive lever the way voice is, and any leakage feature built on
  # SMS on/off-net mix carries no pricing signal. Use voice for that.
  sms_onnet_lyd: 0.050
  sms_offnet_lyd: 0.050
  sms_international_lyd: 0.250

  # Bjawak -- the PAYG data service.
  #
  # 25 dirham/MB = 25 LYD/GB. The monthly 80 GB bundle is 80 LYD = 1 LYD/GB,
  # so PAYG data runs ~25x the bundle rate. That makes bundle_vs_payg_share a
  # far stronger signal than in a normal market: a subscriber paying PAYG data
  # rates is either unaware of bundles or cannot afford one up front. Both are
  # actionable and they need different treatment -- the first is a comms
  # problem, the second an affordability problem, and M3 should not send the
  # same offer to both.
  data_service_name: Bjawak
  data_lyd_per_mb: 0.025
  payg_to_bundle_price_ratio: 25           # derived, for reference

  # Q5 confirmed: no zero-rated apps. All traffic consumes allowance.
  zero_rated_apps: none

# ---------------------------------------------------------------------------
# 3. CATALOGUE
# ---------------------------------------------------------------------------
catalogue:
  status: confirmed
  file: conf/catalogue.yaml
  source: Almadar/internet_offers_data_v4.csv
  # 37 bundles across 12 families. Predominantly data. Voice minutes appear
  # in only two places -- the morning pass (unlimited) and the shared Family
  # plans -- which makes the morning pass the primary voice instrument as well
  # as the off-peak data one.
  notes:
    - "The off-peak product is عروض الصبح -- 06:00-11:00, MORNING not night."
    - "Volumes for most bundles are inferred from package names; confirm."
    - "variable_cost_lyd throughout the catalogue is an estimate, not operator data."

# ---------------------------------------------------------------------------
# 4. BASE AND ECONOMICS
# ---------------------------------------------------------------------------
base:
  status: assumption      # ← Q7, now informed rather than inherited
  source: "team estimate, 2026-09-18; not operator-published"
  addressable_prepaid_subscribers: 1_000_000

  # 40 LYD is set against the real price sheet rather than inherited. The
  # BASE monthly bundle -- the one a subscriber needs for all-day data -- is
  # نت 20 at 35 LYD, and the ladder runs 20-400 LYD above it. An ARPU below
  # the base bundle would imply most of the base does not hold one, which the
  # catalogue's shape contradicts. 40 LYD puts the average subscriber just
  # above the base monthly, which is what the product structure implies.
  #
  # Two numbers follow from this and are used throughout:
  #   12-month value per subscriber ..... 480 LYD
  #   CLV ceiling (15% of that) .......... 72 LYD
  # Revenue at risk is 35,000 x 40 = 1.4M LYD/month.
  monthly_arpu_lyd: 40.0

  # The blended cost of one retention offer, averaged over the ladder's three
  # stages. It lived only as a hardcoded constant in the proposal-consistency
  # test until M3 needed it, which meant the number the entire business case
  # turns on had no single source -- the document, the test and the decision
  # engine could each have drifted to a different one.
  #
  # Break-even uplift follows directly and is the tightest number in the
  # project:  5 / 480 = 1.0417 pp.
  blended_incentive_lyd: 5.0

  monthly_silent_churn_rate: 0.035
  prepaid_share_of_base: 0.95

  # Revised 60% -> 85%. At this level dual-SIM is the norm, not a segment,
  # which promotes incoming_outgoing_ratio from a clever extra to the central
  # feature: if 85% of the base holds two SIMs, "active" tells you almost
  # nothing and share-of-wallet tells you almost everything.
  dual_sim_penetration: 0.85

# ---------------------------------------------------------------------------
# 5. CALENDAR
# ---------------------------------------------------------------------------
calendar:
  salary_week:
    status: assumption    # ← Q8
    day_of_month_start: 25
    day_of_month_end: 30
    recharge_multiplier: 1.8

  # Ramadan seasonality REMOVED (Q8). It needs real per-year dates, the window
  # shifts ~11 days annually, and the effect we would have applied (night data
  # up, daytime voice down) was a guess with a large magnitude. A large guessed
  # effect is worse than none: it puts structure in the data that the models
  # will happily learn and that nothing validates. Add it back only with real
  # seasonal data.

  daily_profile:
    # The 06:00-11:00 trough is CONFIRMED by the existence of عروض الصبح --
    # the operator priced its own spare capacity and told us when it is.
    # That is unusually strong evidence for an assumption of this kind.
    trough_hours: { status: confirmed, from: 6, to: 11, source: "عروض الصبح time condition" }
    peak_hours:   { status: assumption, values: [19, 20, 21, 22] }

  # Friday-Saturday is Libya's official weekend -- a public fact about the
  # country, not an operator figure we are estimating, so this is confirmed
  # rather than assumed.
  #
  # Kept deliberately small: a derived is_weekend flag and NOTHING ELSE. No
  # usage multiplier, because that would be the guessed part. The weekly
  # rhythm comes from the flag alone.
  #
  # Why it matters enough to keep: it lets the system tell a commuter from
  # someone who sleeps in, which is exactly the distinction the 06:00-11:00
  # morning pass turns on. `weekend_usage_share_30d` in conf/features.yaml is
  # the feature that carries it, and it is one of the few cheap signals of
  # whether a subscriber's mornings are actually free.
  weekend_days:
    status: confirmed
    source: "Libya's official weekend"
    values: [friday, saturday]
    apply_usage_multiplier: false

# ---------------------------------------------------------------------------
# 6. GEOGRAPHY -- REMOVED (Q9)
# ---------------------------------------------------------------------------
# No districts, no cell identifiers, no OpenCelliD, no per-district outage
# multipliers. All subscribers are modelled as geographically equivalent.
#
# Why: with the network module out of scope, geography had no consumer left.
# The risk map is gone, and `district` survived only so the fairness guardrail
# could forbid it -- generating a field purely so a test can assert we did not
# use it. Removing it also sheds a dataset, an API key and a CC BY-SA
# attribution obligation.
#
# WHAT WE KEPT: network quality as a SUBSCRIBER-LEVEL feature. That is real
# measured signal, not an invented Libyan field -- UCI Iranian has a
# `Call Failures` column and Cell2Cell has dropvce/blckvce/unansvce. See
# conf/features.yaml#network_quality. Component 2 can supply a better version
# of the same per-subscriber numbers later; see docs/INTEGRATION.md section 6.
#
# Consequence, handled in conf/pricing.yaml: the redlining audit had nothing
# left to audit, so it was replaced by a discount-distribution audit across
# value deciles and tenure bands -- a real fairness question with data behind
# it rather than theatre.

# ---------------------------------------------------------------------------
# 7. LANGUAGE
# ---------------------------------------------------------------------------
language:
  status: confirmed       # ← Q10: Modern Standard Arabic
  # MSA for all customer-facing copy. Dialect would read as more authentic to a
  # Libyan audience, but MSA is understood everywhere and is the safer choice
  # if the evaluators are not Libyan.
  default: ar
  render_copy_in: ar
  distribution:
    ar: 0.55              # Modern Standard Arabic
    ar-LY: 0.38           # Libyan dialect
    ber: 0.04             # Amazigh / Tamazight
    en: 0.03
  # Arabic SMS is UCS-2 encoded: 70 characters, not 160. Offer copy that fits
  # in English will silently become two messages in Arabic.
  sms_max_chars_arabic: 70
  sms_max_chars_latin: 160
