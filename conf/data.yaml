# ---------------------------------------------------------------------------
# Layer 1-2 — sources and the synthesis engine                   (Owner: E1)
# Full attribution and licence detail: data/README.md
# ---------------------------------------------------------------------------

sources:

  # --- A: PRIMARY. Prepaid, MENA, has a network-quality feature, and its
  # 9-month observation / 3-month gap is the operational framing we need.
  uci_iranian:
    id: A
    enabled: true
    loader: ucimlrepo
    uci_id: 563
    licence: CC-BY-4.0
    expected_rows: 3150
    expected_features: 13
    quality:
      # Roughly 9.5% exact duplicates. Deduplicate before anything else.
      drop_exact_duplicates: true
      expected_duplicate_rows: 300
      duplicate_row_tolerance: 50
    # This field partially encodes the outcome. Dropping it is why our
    # reported metrics are lower than the published ~0.99 AUC.
    leaky_columns:
      - "Customer Value"

  # --- B: scale, and real distributions for our two signature features.
  # 3,000 rows cannot ground a distribution; this is the volume source. It is
  # the original two-file Duke distribution rather than a preprocessed
  # single-table cut, which is why it carries columns the condensed versions
  # drop.
  cell2cell:
    id: B
    enabled: true
    loader: local_csv_pair
    path: ./data/raw/telecom/telecom
    files:
      client: Client.csv           # 100,000 x 50 -- commercial and handset
      record: Record.csv           # 100,000 x 51 -- behavioural means + label
    join_on: Customer_ID           # 1:1, verified complete
    licence: public-research
    expected_rows: 100000

    # WHY THIS SOURCE MATTERS BEYOND ROW COUNT.
    # Two features carry most of this project's differentiation, and both were
    # otherwise generated end-to-end with no empirical reference:
    #
    #   incoming/outgoing ratio  <- recv_vce_Mean / plcd_vce_Mean
    #   off-peak usage share     <- mou_opkv_Mean / (mou_peav_Mean + mou_opkv_Mean)
    #
    # Both columns are 0% null across all 100,000 rows. See
    # docs/data_dictionary.md for the measured distributions we generate against.
    grounds_features:
      incoming_outgoing_ratio: [recv_vce_Mean, plcd_vce_Mean]
      offpeak_usage_share: [mou_opkv_Mean, mou_peav_Mean, opk_vce_Mean, peak_vce_Mean]
      # TWO decay ratios, not one. Minutes and revenue disagree -- 46.8% of
      # subscribers declining on usage against 42.2% on spend -- because usage
      # turns down first. Generating one and labelling it the other flattens
      # the early-warning signal the feature exists to carry.
      usage_decay_ratio: [avg3mou, avg6mou, change_mou]
      revenue_decay_ratio: [avg3rev, avg6rev, change_rev]
      short_call_share: [inonemin_Mean]     # matters under a 3-minute block tariff
      service_quality: [drop_vce_Mean, blck_vce_Mean, unan_vce_Mean,
                        drop_dat_Mean, blck_dat_Mean, drop_blk_Mean]
      care_contact_volume: [custcare_Mean, ccrndmou_Mean, cc_mou_Mean]
      household_lines: [uniqsubs, actvsubs]  # relevant to the shared Family plans
      tenure: [months]
      roaming: [roam_Mean]

    # ⚠ THE LABEL PREVALENCE IS NOT USABLE.
    # This cut is deliberately balanced at ~49.6% churn. The natural rate is a
    # small fraction of that. Training on it without correction and then
    # calibrating would calibrate to a 50% prior, which silently destroys the
    # project's central claim that a 0.31 means 31%.
    #
    # Use this source for feature STRUCTURE and correlation. Take the base rate
    # from conf/market.yaml#base.monthly_silent_churn_rate.
    churn_rate_in_file: 0.4956
    use_label_prevalence: false
    require_prior_correction: true

    # ⚠ DROPPED AT INGESTION, NOT MERELY EXCLUDED FROM PRICING.
    # US household marketing data. A Libyan prepaid operator holds none of it,
    # and several entries are protected or proxy-protected attributes that must
    # never enter a pricing system in any form. Dropping them at the ingestion
    # boundary means they cannot reach a feature matrix by accident later.
    drop_columns:
      - ethnic
      - marital
      - income
      - adults
      - kid0_2
      - kid3_5
      - kid6_10
      - kid11_15
      - kid16_17
      - ownrent
      - dwlltype
      - dwllsize
      - numbcars
      - HHstatin
      - infobase
      - prizm_social_one
      - creditcd
      - lor
      - rv
      - truck
      - forgntvl
      - area                       # US geography; this project models none

  # --- C: independent CLTV benchmark, churn-reason taxonomy, fast baseline.
  ibm_telco:
    id: C
    enabled: true
    loader: kaggle
    dataset: yeanzc/telco-customer-churn-ibm-dataset
    licence: ibm-public-sample
    expected_rows: 7043
    churn_rate: 0.27
    benchmark_columns: [CLTV, "Churn Reason", "Churn Score"]

  # Dataset D (OpenCelliD) REMOVED with geography -- see conf/market.yaml
  # section 6. No cells are modelled, so there is nothing to join to, and
  # dropping it also sheds an API key and a CC BY-SA attribution obligation.

  # --- VALIDATION SOURCES. Enabled, and not optional in any meaningful
  # sense: each one turns a claim about a METHOD into a measurement of it, on
  # real data, before that method is pointed at a generated population.
  #
  # These were once `enabled: false` while the proposal's strongest claim
  # rested on them. That is the failure mode they are now enabled to prevent.
  # Rationale and download links: data/README.md#recommended-additions

  # F: the only REAL treatment/control data in the project. The uplift method
  # is validated here, then applied to the synthetic population -- which is how
  # we answer "your data is generated, how do we know it works?" for M3.
  criteo_uplift:
    id: F
    enabled: true
    # NOT sklift, and not Criteo's own link. Both are dead as of 2026-09-18:
    #   sklift.datasets.fetch_criteo  -> 403 (hardcoded S3 bucket)
    #   go.criteo.net/...csv.gz       -> 404 (retired by Criteo)
    # The dataset is still published on HuggingFace, so the loader downloads
    # from there directly: no credential, no `datasets` dependency, one 311 MB
    # file cached on first use, then a seeded 10% Parquet sample.
    loader: http               # cvm.ingest.criteo_uplift.SOURCE_URL
    source_url: https://huggingface.co/datasets/criteo/criteo-uplift/resolve/main/criteo-research-uplift-v2.1.csv.gz
    archive_mb: 311
    licence: academic-research-use
    expected_rows: 13979592
    sample_10pct_default: true
    # `visit` rather than `conversion` as the outcome: ~4.7% against ~0.3%.
    # A 0.3% base rate needs far more rows to resolve an uplift, and the method
    # is what is being validated, not Criteo's conversion funnel.
    columns: {treatment: treatment, outcome: visit, secondary_outcome: conversion}
    role: validate_uplift_method
    note: >
      Sub-sampled non-uniformly by Criteo so the true incrementality level
      cannot be recovered. Use it to validate METHOD, never to quote an
      effect size.

  # G: small, clean uplift set. Get the two-model difference working here
  # before scaling to Criteo. Also the clearest demonstration of sleeping dogs.
  hillstrom:
    id: G
    enabled: true
    loader: sklift          # from sklift.datasets import fetch_hillstrom
    licence: public
    expected_rows: 64000
    arms: [mens_email, womens_email, no_email]
    role: uplift_warmup
    # Measured on load: 6.09 pp naive lift across both email arms, 7.66 pp for
    # the men's arm alone. Large and balanced, which is why the four quadrants
    # separate visibly here and why it is the right data for the quadrant chart.
    measured_naive_lift_pp: {both_arms: 6.09, mens_email: 7.66}

  # H: churn as an ABSENCE (no renewal within 30 days of expiry) plus genuine
  # DAILY user logs -- the closest public analogue to prepaid silent churn.
  # Kept disabled: with the sequence arm out of scope, the daily logs are no
  # longer worth the ingestion cost.
  kkbox:
    id: H
    enabled: false
    loader: kaggle_competition
    competition: kkbox-churn-prediction-challenge
    licence: competition-rules
    role: real_daily_sequences
    note: "~30 GB raw. Sample members first, then stream-filter user_logs."

  # Dataset I (Milan CDR) REMOVED. Its only purpose was real per-cell load
  # curves for off-peak trough detection, and that was dropped with geography.
  # M3 now uses the operator's own published 06:00-11:00 window, which is
  # better evidence than any trough we could detect.

  # J: the canonical BG/NBD + Gamma-Gamma validation set. Prove the CLV
  # implementation is correct here before pointing it at recharges.
  online_retail:
    id: J
    enabled: true
    loader: ucimlrepo
    uci_id: 502
    licence: CC-BY-4.0
    expected_rows: 1067371
    role: validate_clv_implementation
    # BG/NBD is a repeat-purchase model. M2 asks it to treat a recharge as a
    # transaction, which is a defensible reading -- prepaid is non-contractual
    # and alive-or-dead-unobserved, exactly BG/NBD's regime -- but a defensible
    # reading is not a validated model. Fit here first, against a real holdout.
    holdout:
      calibration_period_end: "2011-06-01"
    # NOT reachable through ucimlrepo: id 502 exists in the repository but is
    # published as a two-sheet Excel workbook, so fetch_ucirepo raises
    # DatasetNotFoundError. The loader pulls the static archive instead and
    # reads BOTH sheets -- one sheet is half the period, which halves every
    # observed inter-purchase time and biases BG/NBD toward short lifetimes.
    archive_url: https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip
    exclusions:
      # Each of these would otherwise corrupt a lifetime value.
      - no_customer_id            # ~25% of lines; attributable to nobody
      - credit_notes              # a return is not a negative purchase
      - non_positive_price        # adjustments and samples, not revenue
    # Measured 2026-09-18: 805,549 of 1,067,371 lines kept (24.5% dropped),
    # 5,878 customers, 2009-12-01 to 2011-12-09, 71.3% repeat buyers.
    measured:
      clean_lines: 805549
      customers: 5878
      repeat_buyer_share: 0.713

# ---------------------------------------------------------------------------
# Layer 2 — CTGAN synthesis
#
# We are creating a non-existent population of Libyan subscribers, which is
# precisely the unit's stated objective applied to tabular rather than image
# data. A generator proposes rows, a discriminator tries to separate them from
# real ones, and the two train adversarially until the generator wins.
# ---------------------------------------------------------------------------
synthesis:
  n_subscribers: 100000
  seed: 606

  models:
    ctgan:                       # primary
      enabled: true
      epochs: 300
      batch_size: 500
      generator_dim: [256, 256]
      discriminator_dim: [256, 256]
    # PRIMARY. One copula per behavioural cluster. A single copula imposes one
    # dependence structure on the whole population and real subscribers do not
    # have one -- averaging a commuter and a dormant line produces rows between
    # clusters where nobody lives, and a detector finds them at once.
    # Measured at k=32: logistic detection 0.511 against a 0.468 real-vs-real
    # floor, and correlation delta 0.029. See ctgan_engine._MixtureCopula.
    mixture_copula:
      enabled: true
      n_clusters: 32
      min_cluster_rows: 200

    tvae:                        # challenger
      enabled: true
      epochs: 300
    gaussian_copula:             # classical baseline
      enabled: true
      # Per-column marginals, chosen by shape. Beta for the columns genuinely
      # bounded on [0, 1]; Gamma for the positive heavy-tailed ones.
      #
      # SDV's default is Beta for everything, which cannot represent a
      # heavy-tailed positive quantity -- the first run scored KS-complement
      # 0.72. And the obvious alternatives are unavailable: `truncnorm` and
      # `gaussian_kde` both ABORT AT THE C LEVEL on this data (exit 127, no
      # traceback). Timings on the backbone: beta 8.2s, norm 4.8s, gamma 6.1s,
      # truncnorm crash, gaussian_kde crash.
      bounded_distribution: beta
      unbounded_distribution: gamma
  # Comparing all three is itself a reportable experiment, not scaffolding.
  report_comparison: true

  # Iranian `Charge Amount` is ordinal 0-9. Quantile-map it onto the LYD
  # scratch-card ladder so a 90th-percentile spender lands on 50-100 LYD
  # cards, not 5 LYD.
  quantile_mapping:
    enabled: true
    # Almadar's confirmed ladder. Mirrors conf/market.yaml#recharge --
    # do not let these drift apart.
    recharge_denominations_lyd: [5, 10, 20, 40, 100]
    weight_toward_low_denominations: true

  # Constructs the real data cannot supply.
  business_overlays:
    # Subscriber-level, with no geographic variation -- all subscribers are
    # modelled as geographically equivalent (Q9).
    service_outage_exposure:
      enabled: true
      level: subscriber
    # Ramadan removed (Q8): needs real per-year dates and the effect was a
    # large guess.
    salary_week_spike:
      enabled: true
      day_of_month_window: [25, 30]
    # Friday-Saturday rhythm. A flag only -- no usage multiplier.
    weekend_rhythm:
      enabled: true
      days: [friday, saturday]
      apply_usage_multiplier: false
    # Both Almadar emergency-credit products. See conf/catalogue.yaml.
    emergency_credit_behaviour: true
    diaspora_roaming: true
    # The morning off-peak window is a real product, so generated usage
    # must show a 06:00-11:00 bump for the subscribers who buy it.
    morning_offpeak_usage: true

  # Explicit and documented in the repository, so the model has recoverable
  # signal and the evaluation is honest about being a simulation ground truth.
  hazard_function:
    documented_at: docs/architecture.md#label-generation
    base_monthly_churn: 0.035

    # Weights on the STANDARDISED drivers, combined on the logit scale. In
    # config because an evaluator may well ask to change one live, and because
    # the sign of each is a claim about prepaid behaviour that should be
    # readable without opening Python.
    #
    # The intercept is NOT set here: it is solved per run so that the mean
    # drawn probability equals base_monthly_churn. Fixing both the weights and
    # the intercept would let the realised churn rate drift away from the
    # market assumption every time a weight changed.
    driver_weights:
      days_since_last_topup: 0.90      # the strongest single tell
      recharge_gap_cv: 0.55            # erratic beats infrequent-but-regular
      balance_zero_hours_30d: 0.45     # no postpaid equivalent exists
      incoming_outgoing_ratio: 0.50    # dual-SIM: this became the receiving SIM
      service_outage_hours_30d: 0.30   # real measured signal, modest weight
      onnet_ratio: -0.35               # NEGATIVE: off-net share rising = leaving

    # Spread of the hazard across the population. Too low and every subscriber
    # is average, so there is nothing for a model to rank; too high and the
    # label is nearly deterministic and every metric looks wonderful.
    logit_scale: 1.0

  # Quality gate. Above the detection threshold the generator is REJECTED and
  # retrained. We evaluate the GAN with an adversarial test — the same
  # principle that trains it.
  quality_gate:
    enabled: true
    fail_build_on_breach: true

    # EVERY THRESHOLD IS SET AGAINST A MEASURED FLOOR, not chosen on paper. The
    # floor is two disjoint halves of REAL data scored against each other --
    # what a perfect generator would achieve, and what nothing can beat.
    ks_complement_min: 0.85
    pairwise_correlation_delta_max: 0.10

    # TWO DETECTORS, TWO THRESHOLDS, and the pairing is the point.
    #
    # An earlier version applied a single 0.65 to a tuned gradient booster and
    # no generator ever reached it -- the best was 0.77 against a 0.498 floor.
    # That 0.65 comes from the synthetic-data literature, where the standard
    # detection metric uses LOGISTIC REGRESSION. Applying it to a booster is a
    # category error: they are different adversaries and the number means
    # different things to each.
    #
    # Logistic GATES at the literature's 0.65 and the population clears it at
    # 0.519 against a 0.468 floor -- very nearly linearly indistinguishable
    # from real data.
    detection_auc_logistic_max: 0.65

    # The BOOSTED detector is REPORTED, NOT GATED, and that is a deliberate
    # decision rather than a convenience. It is the only one of the five with
    # no defensible absolute threshold:
    #
    #   * It rises without bound with n. For ANY generator that is not exact, a
    #     flexible enough detector with enough rows separates the two
    #     distributions. Measured on one generator: 0.770 / 0.837 / 0.860 at
    #     three sample sizes. The real-vs-real floor stays at 0.498 throughout.
    #   * TSTR measures directly what this is a proxy for -- whether a model
    #     trained on the population works on real subscribers -- and answers
    #     0.943. "A booster can partly tell them apart" and "a booster trained
    #     on one transfers to the other" are different claims, and only the
    #     second decides whether the population is usable.
    #
    # So it is printed on every run, beside its floor, and recorded below. What
    # it must never become is a number nobody looks at: a rise from 0.84 toward
    # 1.00 means the generator has regressed, and the report says so.
    detection_auc_boosted_reported_only: true
    detection_auc_boosted_watch_above: 0.90

    # THE ONE THAT ACTUALLY MATTERS. Detection asks "can an adversary tell
    # these apart", which is a proxy. TSTR asks the question this project needs
    # answered: if M1 trains on this population, does it work on real
    # subscribers? Train downstream on synthetic, test on held-out real, and
    # express it as a fraction of training on real.
    #
    # LightGBM, because M1 is LightGBM. "A booster can partly tell them apart"
    # and "a booster trained on one transfers to the other" are different
    # claims, and only the second decides whether the population is usable.
    tstr_retention_min: 0.90
    tstr_target: had_care_contact

    detector: lightgbm
    # THE SAMPLE SIZE IS PART OF THE METRIC. Detection AUC rises with n for any
    # imperfect generator -- measured, the same generator scores 0.770 at
    # 20,000 rows and 0.860 at 100,000, while the real-vs-real floor stays at
    # 0.498 because those two samples genuinely are one distribution. A
    # threshold with no stated n is underspecified the way a p-value with no
    # stated n is, so the detector always sees this many rows per class.
    detector_sample_size: 20000
    # Scored against HELD-OUT real rows the generator never saw. Scoring
    # against its own training rows asks "can you tell this from the rows the
    # generator memorised", which penalises memorisation twice and says nothing
    # about realism. See quality_gate.split_for_gate.
    holdout_fraction: 0.25

    # Measured 2026-09-19, 20k rows, mixture copula at k=32 with empirical
    # marginals. Recompute with `python -m cvm.synthesis.run` after any change
    # to the backbone or the generator.
    measured:
      floor:
        ks_complement: 0.977
        correlation_delta: 0.020
        detection_auc_logistic: 0.468
        detection_auc_boosted: 0.498
      best_generator: mixture_copula_k32
      ks_complement: 0.987
      correlation_delta: 0.029
      detection_auc_logistic: 0.519
      detection_auc_boosted: 0.837     # reported, not gated -- see above
      tstr_retention: 0.943
      # Rejected along the way, and why the gate is not decorative. Every one
      # of these failed a GATING metric, not the reported one:
      #   ungated copula, fitted marginals   KS 0.853, boosted 0.9998
      #   single copula, empirical marginals logistic 0.593
      #   tvae, 300 epochs                   corr 0.075, boosted 0.906
      # The truncated tails, the Gamma zero-spike and the ordering violations
      # all had to be fixed before anything passed.

  # Generated data that is too clean makes models look unrealistically good.
  realism_injection:
    missingness_rate: 0.03
    measurement_noise_sd: 0.02
