# ---------------------------------------------------------------------------
# DECISION ENGINE — is intervening worthwhile, and with what?   (Owner: E4)
#
# Step four of the pipeline. Consumes M1 (churn), M2 (value/CLV), M3 (uplift)
# and M4 (credit) and answers two questions:
#
#   1. Is treating this subscriber economically worthwhile?
#         E[gain] = uplift x CLV - offer_cost      (from M3)
#   2. If so, which action? Chosen from the operator's REAL catalogue, so the
#      recommendation is executable and its cost is not something we invented.
#
# "No action" is a first-class outcome here, not a failure to decide.
#
# Everything below is enforced in src/cvm/decision/guardrails.py and asserted
# in tests/guardrails/. Changing a number here changes system behaviour and
# must keep the guardrail suite green.
# ---------------------------------------------------------------------------

# The action space. Not the optimisation target -- the set of things the engine
# is allowed to recommend, and where their real costs come from.
action_space:
  source: conf/catalogue.yaml
  include_no_action: true        # always a candidate, and often the right one
  # An offer we invented would have a cost we invented, which would make the
  # margin floor enforce one made-up number against another. Real prices are
  # what keep the guardrails meaningful.
  forbid_synthetic_offers: true

# P(i,b) = P_base(b) * (1 - d(i,b))
#
# d(i,b) = clip( w1*ChurnRisk(i)
#              + w2*LoyaltyIndex(i)
#              + w3*PriceSensitivity(i,b)
#              - w4*AffordabilityHeadroom(i),
#              0, d_max(tier(i)) )
discount_weights:
  w1_churn_risk:            0.40   # urgency
  w2_loyalty_index:         0.25   # earned reward
  w3_price_sensitivity:     0.25   # elasticity
  w4_affordability_headroom: 0.20  # subtracted: do not discount those who can pay

tiers:
  bronze:
    qualification: "tenure_months < 12"
    d_max: 0.05
    preferred_instrument: price_discount
  silver:
    qualification: "12 <= tenure_months < 36 and regular_recharge"
    d_max: 0.10
    preferred_instrument: discount_or_bonus_mb
  gold:
    qualification: "36 <= tenure_months < 84 and high_rfm_le"
    d_max: 0.15
    preferred_instrument: morning_pass
  platinum:
    qualification: "tenure_months >= 84 or value_decile == 10"
    d_max: 0.20
    # The morning pass carries unlimited VOICE as well as unlimited data, so
    # it is the voice instrument too. Only two families in the catalogue
    # include minutes at all -- this one and the shared Family plans -- which
    # makes it the natural answer for a subscriber showing voice leakage.
    preferred_instrument: morning_pass_plus_volume_upgrade

# --- The six guardrails. Enforced in code, tested in CI. -------------------
guardrails:

  # 1. Margin floor — no loss-making offer, ever.
  #    P(i,b) >= variable_cost(b) * (1 + min_margin)
  margin_floor:
    enabled: true
    min_margin: 0.15

  # 2. CLV ceiling — the constraint that makes this defensible to a CFO.
  #    Cumulative 12-month discount spend on a subscriber never exceeds this
  #    fraction of their predicted 12-month CLV.
  clv_ceiling:
    enabled: true
    max_fraction_of_clv: 0.15
    horizon_months: 12

  # 3. Budget constraint — cohort allocation as a knapsack / LP (PuLP).
  #    Maximise expected retained margin s.t. total discount cost <= budget.
  budget:
    enabled: true
    solver: PULP_CBC_CMD
    default_campaign_budget_lyd: 144000
    objective: maximise_expected_retained_margin

  # 4. Cannibalisation guard — re-based on the SHAPE OF THE LADDER.
  #
  #    The naive version of this guard assumed a 1 LYD morning pass could pull
  #    someone off any monthly bundle. It cannot, and the reason is structural:
  #    نت 20 at 35 LYD is the BASE monthly, the bundle a subscriber needs to
  #    have data outside 06:00-11:00 at all. Free morning data does not remove
  #    that need, so the base is not substitutable and a subscriber sitting on
  #    it has nowhere to fall.
  #
  #    The exposed population is only those ABOVE the base -- نت 40 at 50, نت 80
  #    at 80, the 5G monthlies, Elite and Family. For them the pass can justify
  #    stepping DOWN a rung, and the loss is the gap between rungs, not the
  #    whole bundle.
  #
  #    This makes the guard mechanistic rather than statistical: current bundle
  #    is the actual exposure, where value_decile was only ever a proxy for it.
  cannibalisation:
    enabled: true

    # The structural exemption. On or below the base monthly -- or on no
    # monthly bundle at all -- there is no rung to fall to.
    base_monthly_offer_id: MO_20
    base_monthly_price_lyd: 35
    exempt_at_or_below_base_monthly: true

    # Retained as a secondary filter for subscribers ABOVE the base, where the
    # exposure is real: low churn risk AND high value would have paid anyway.
    exclude_if_churn_prob_below: 0.15
    exclude_if_value_decile_above: 8

    # The off-peak pass is additive, not substitutable: it must not simply
    # shift usage that was already being paid for.
    require_additive_offpeak_pack: true

    # Break-even depends on how far a downgrader falls: one rung (50 -> 35 + 1
    # pass) costs 14 LYD/month and breaks even at ~7.1% of the treated cohort;
    # two rungs (80 -> 35 + 1) costs 44 LYD/month and breaks even at ~2.3%.
    # The cap is set below the WORST case, not tuned to the best one.
    max_simulated_arpu_erosion: 0.02

  # 5. Fairness — no pricing on protected or proxy-protected attributes.
  fairness:
    enabled: true
    forbidden_pricing_features:
      - age_group         # may inform offer relevance, never price
      - language_pref
      - gender
      - district          # kept on the list although we no longer model it,
                          # so reintroducing geography cannot silently make it
                          # a price lever
    # The redlining audit across districts was REMOVED with geography (Q9) --
    # auditing a dimension we no longer model would be theatre.
    #
    # Replaced by a distribution audit we can actually run: are we
    # systematically giving less to low-value or newer subscribers? That is a
    # real fairness question, and unlike redlining it is answerable with the
    # data this branch holds.
    distribution_audit:
      enabled: true
      across:
        - value_decile
        - tenure_band
      max_mean_discount_gap: 0.05
      note: >
        A gap is expected and legitimate -- loyalty tiers exist, and d_max
        rises with tenure by design. The audit catches a gap LARGER than the
        tier structure explains, which is the signal that something other
        than the published ladder is driving price.

  # 6. Auditability — every decision replayable.
  audit:
    enabled: true
    log_table: decision_log
    persist:
      - inputs
      - weights
      - active_constraints
      - reason_codes
      - expected_margin_lyd
    retention_days: 365

# --- Off-peak offloading ---------------------------------------------------
# Almadar's off-peak product is عروض الصبح: 1 LYD, unlimited data AND voice,
# valid 06:00-11:00. The operator has already priced its own spare capacity
# and told us when it is -- so M3 personalises an existing product rather
# than proposing a new one. That is a materially stronger position, and the
# trough is MORNING, not night. See conf/catalogue.yaml#morning_offpeak.
offpeak:
  anchor_product: SABAH_1
  # ONE national window, and it is the operator's own. Per-cell trough
  # detection was dropped with geography (Q9): it needed cell load curves we
  # no longer model, and it was only ever a refinement of this window. Using
  # the real published hours is not a compromise -- it is the answer.
  window: { start_hour: 6, end_hour: 11 }
  per_cell_trough_detection: false
  # Off-peak data is preferred over headline cuts: near-zero marginal cost on
  # an idle sector, perceived as generous, and it leaves the price sheet intact.
  value_add_before_discount: true
  # A 1 LYD unlimited morning pass is a remarkably cheap retention
  # instrument. Granting one costs less than discounting almost anything
  # else in the catalogue, which is why the engine reaches for it first.
  prefer_anchor_product_as_bonus: true
  # Only offer it to subscribers who will actually use it.
  min_offpeak_data_ratio_to_qualify: 0.20

# Uplift now lives in conf/models/m3_uplift.yaml -- it is a model, not a
# pricing knob. The decision engine consumes its output.

# --- Retention ladder ------------------------------------------------------
# A delivery policy over M1b and M3, not a separate module.
retention_ladder:
  # Stage boundaries come from the hazard function, not from intuition.
  # Kaplan-Meier / hazard inflection points, recomputed per segment.
  derive_boundaries_from_hazard: true
  fallback_boundaries_days: [7, 30, 60]
  # The inverted-U: recovery probability collapses faster than offer value
  # rises, so optimal spend is low, then high, then LOW AGAIN.
  spend_profile: [low, peak, low]
  stages:
    cooling:
      trigger: "recharge_gap > subscriber_baseline_gap"
      instruments: [reminder_sms, small_offpeak_bonus, advance_limit_reminder]
    cold:
      trigger: "past_first_hazard_inflection"
      instruments: [personalised_priced_bundle, loyalty_bonus, onnet_pack_if_leakage]
    dormant:
      trigger: "past_second_hazard_inflection"
      instruments: [single_low_cost_winback]
      then: stop
