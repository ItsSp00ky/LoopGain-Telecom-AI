# ---------------------------------------------------------------------------
# M1 — Silent Churn Engine                                  (Owner: E2)
#
# Structured as an experiment rather than a single model, because the
# experiment is more informative than either arm alone. Either outcome is a
# result: the BENCHMARK is the deliverable, not the winner.
# ---------------------------------------------------------------------------

benchmark:
  arms: [arm_a_lightgbm, arm_b_lstm]
  # Shared framing, identical for both arms so the comparison is fair.
  observation_days: 90
  gap_days: 15
  outcome_days: 30
  split: temporal

# --- Arm A: LightGBM on ~80 engineered features ----------------------------
arm_a_lightgbm:
  primary: lightgbm
  challengers: [xgboost, catboost]
  # Interpretable baselines. Reported beside the boosted arms, not discarded.
  interpretable_baselines: [decision_tree, logistic_regression]
  # Also reported in the benchmark table.
  additional_baselines: [naive_bayes, knn, svm]
  params:
    objective: binary
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    n_estimators: 1000
    early_stopping_rounds: 50
  tuning:
    library: optuna
    n_trials: 50            # time-boxed. Descoping ladder step 6 drops this.
    direction: maximize
    metric: average_precision

# --- Arm B: LSTM on raw daily sequences ------------------------------------
arm_b_lstm:
  framework: tensorflow_keras
  input_shape: [90, 4]      # (timesteps, channels) — see features.yaml
  architecture:
    - { layer: Masking,  mask_value: 0.0 }
    - { layer: LSTM,     units: 64, return_sequences: true }
    - { layer: Dropout,  rate: 0.3 }
    - { layer: LSTM,     units: 32 }
    - { layer: Dense,    units: 16, activation: relu }
    - { layer: Dense,    units: 1,  activation: sigmoid }
  compile:
    optimizer: adam
    learning_rate: 0.001
    loss: binary_crossentropy
  training:
    epochs: 100
    batch_size: 256
    # Overfitting control.
    callbacks:
      early_stopping:   { monitor: val_auc, patience: 10, restore_best_weights: true }
      reduce_lr:        { monitor: val_loss, factor: 0.5, patience: 5 }
      model_checkpoint: { save_best_only: true }
      tensorboard:      { log_dir: ./artifacts/reports/tensorboard }
  # Gating is what lets gradient survive 90 timesteps; a plain RNN would not.
  runs_on: colab_t4
  checkpoint_to_drive_every_epoch: true   # Colab sessions get cut

# --- Calibration -----------------------------------------------------------
# Both arms. Pricing consumes probabilities as monetary expectations, so a
# 0.31 must actually mean 31%.
calibration:
  method: isotonic
  cv: 5
  mandatory: true

# --- Metrics ---------------------------------------------------------------
metrics:
  primary: pr_auc
  report: [pr_auc, lift_at_decile_1, lift_at_decile_2, lift_at_decile_3,
           brier_score, roc_auc, calibration_curve]
  # Meaningless at a 10-30% base rate. CI fails if it appears as a headline.
  forbid_accuracy_as_headline: true
  # Report the inflated published figures AND ours, with the gap explained.
  report_naive_alongside_honest: true

# --- Explainability --------------------------------------------------------
explainability:
  arm_a:
    method: shap_tree_explainer
    surface_in_ui: per_subscriber_waterfall
    plain_language: true
  arm_b:
    # Compared on calibration and lift, not interpretability. The gap is
    # discussed in the report rather than papered over.
    method: none
    discuss_gap_in_report: true

# --- M1b: time-to-churn ----------------------------------------------------
# Classification answers *if*; survival answers *when*. Retention economics
# are timing-sensitive: intervening 40 days early wastes budget, 5 days late
# wastes everything.
survival:
  primary: cox_proportional_hazards     # lifelines
  challenger: random_survival_forest    # scikit-survival
  metric: concordance_index
  outputs:
    - time_to_churn_window
    - kaplan_meier_curve
    - hazard_curve
  # The hazard inflection points define the retention ladder stage boundaries
  # in pricing.yaml. Recomputed per segment.
  derive_retention_ladder_boundaries: true
