# ---------------------------------------------------------------------------
# M1 — Silent Churn Engine                                  (Owner: E2)
#
# Structured as a benchmark rather than a single model: eight algorithms on
# one temporal split, reported with calibration curves rather than a single
# headline number. The BENCHMARK is the deliverable, not the winner.
#
# ONE ARM, DELIBERATELY. This is a gradient-boosting module on engineered
# features. A sequence arm was considered and dropped -- see the scope note in
# the proposal. Everything below is tabular, CPU-trainable, and SHAP-explainable.
# ---------------------------------------------------------------------------

benchmark:
  # Shared framing, identical for every model so the comparison is fair.
  observation_days: 90
  gap_days: 15
  outcome_days: 30
  split: temporal

# --- LightGBM on ~80 engineered features -----------------------------------
gradient_boosting:
  primary: lightgbm
  challengers: [xgboost, catboost]
  # Interpretable baselines. Reported beside the boosted models, not discarded.
  interpretable_baselines: [decision_tree, logistic_regression]
  # Also reported in the benchmark table.
  additional_baselines: [naive_bayes, knn, svm]
  params:
    objective: binary
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    n_estimators: 1000
    early_stopping_rounds: 50
  tuning:
    library: optuna
    n_trials: 50            # time-boxed. Descoping ladder step 6 drops this.
    direction: maximize
    metric: average_precision

# --- Calibration -----------------------------------------------------------
# Every model in the benchmark table. The decision engine consumes these
# probabilities as monetary expectations, so a 0.31 must actually mean 31%.
calibration:
  method: isotonic
  cv: 5
  mandatory: true

# --- Metrics ---------------------------------------------------------------
metrics:
  primary: pr_auc
  report: [pr_auc, lift_at_decile_1, lift_at_decile_2, lift_at_decile_3,
           brier_score, roc_auc, calibration_curve]
  # Meaningless at a 10-30% base rate. CI fails if it appears as a headline.
  forbid_accuracy_as_headline: true
  # Report the inflated published figures AND ours, with the gap explained.
  report_naive_alongside_honest: true

# --- Explainability --------------------------------------------------------
# Tree models throughout, so exact SHAP is available for every score -- which
# is part of why the scope is tabular. There is no model in this module whose
# reasoning we cannot surface per subscriber.
explainability:
  method: shap_tree_explainer
  surface_in_ui: per_subscriber_waterfall
  plain_language: true

# --- M1b: time-to-churn ----------------------------------------------------
# Classification answers *if*; survival answers *when*. Retention economics
# are timing-sensitive: intervening 40 days early wastes budget, 5 days late
# wastes everything.
survival:
  primary: cox_proportional_hazards     # lifelines
  challenger: random_survival_forest    # scikit-survival
  metric: concordance_index
  outputs:
    - time_to_churn_window
    - kaplan_meier_curve
    - hazard_curve
  # The hazard inflection points define the retention ladder stage boundaries
  # in pricing.yaml. Recomputed per segment.
  derive_retention_ladder_boundaries: true
