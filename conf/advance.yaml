# ---------------------------------------------------------------------------
# M4 — Smart Advance: a learned limit for emergency credit      (Owner: E2/E4)
#
# Almadar runs TWO emergency-credit products, both confirmed from operator
# documentation. Product facts live in conf/catalogue.yaml#emergency_credit;
# this file holds the DECISION LOGIC that replaces their allocation rules.
#
#   رصيد في وقته  Rasid fi Waqtuh — airtime advance, 1/3/5 LYD, via *140#
#                 Gate: basic balance <= 0.5 LYD
#                 Allocated "according to the subscriber's consumption"
#
#   نت في وقته    Net fi Waqtuh — emergency data, flat 5 LYD for 2 GB / 3 days
#                 Gate: balance <= 1 LYD AND remaining quota < 250 MB
#                 No tiering whatsoever
#
# ⚠ READ THIS BEFORE QUOTING THE OLD PITCH ⚠
#
# The original proposal was written against LIBYANA's Credit Loan: a 12-month
# tenure gate, a 7-day grace period, degradation to "recharge stage", and
# eventual line reset and resale. That framing DOES NOT TRANSFER to Almadar.
#
#   - There is no tenure gate. Eligibility is "you are nearly out of money".
#   - There is no 7-day grace. Recovery is at first recharge, with a 48-hour
#     auto-settle check.
#   - Recharge stage and line reset are NOT documented for Almadar. Do not
#     claim operator-caused hard churn without evidence for this operator.
#
# The argument that replaces it is below, and it is arguably sharper because it
# falls straight out of the operator's own numbers.
#
# The objective function is unchanged: SUBSCRIBER SOLVENCY, not recovery yield.
# Every guard here is mandatory. tests/guardrails/ enforces them.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# What is actually wrong with the incumbent rules
# ---------------------------------------------------------------------------
incumbent_critique:

  # 1. Both products gate on the subscriber being broke. That is not a risk
  #    filter -- it is the inverse of one. The eligible population is, by
  #    construction, the population least able to repay.
  eligibility_selects_for_distress: true

  # 2. The airtime advance has three tiers allocated "according to the
  #    subscriber's consumption". Consumption is not repayment probability.
  #    A heavy user in decline consumes a lot and repays badly; the rule
  #    cannot tell them apart from a heavy user who is fine.
  allocation_rule_is_consumption_not_risk: true
  allocation_thresholds_published: false

  # 3. The data advance has NO tiering. Five dinars, two gigabytes, three
  #    days, for every subscriber regardless of history.
  data_advance_is_flat_rate: true

  # 4. THE STRUCTURAL FINDING, straight out of the two files:
  #
  #       cheapest recharge card ........ 5 LYD
  #       Net fi Waqtuh debt ............ 5 LYD
  #                                       -------
  #       left over after clearing ...... 0 LYD
  #
  #    The debt is exactly the size of the smallest top-up. A subscriber whose
  #    modal recharge is the 5 LYD card can clear the advance -- and receives
  #    NOTHING for doing so. The entire top-up is consumed by the debt and they
  #    are returned to a zero balance: no airtime, no data, and immediately
  #    eligible to take the advance again.
  #
  #    The harm is therefore behavioural rather than arithmetic. Recharging the
  #    minimum buys no service, so the rational move is to defer recharging --
  #    and a deferred recharge on a prepaid line is indistinguishable from the
  #    beginning of silent churn. That is the mechanism M4 is built to
  #    interrupt, and it is measurable in the generated data.
  #
  #    HONESTY NOTE: an exact equality is weaker evidence than an impossibility
  #    would be. We are claiming a disincentive, not a locked door, and the
  #    business case in the proposal is sized accordingly.
  smallest_card_lyd: 5
  data_advance_debt_lyd: 5
  debt_exceeds_smallest_card: false
  # The load-bearing fact is now the equality, not the inequality.
  debt_consumes_entire_smallest_card: true
  residual_after_clearing_lyd: 0.0

  # 5. The two services are mutually exclusive (you cannot take data credit
  #    while your balance is negative from airtime credit). A subscriber
  #    alternating between them is in sustained distress -- and nothing in the
  #    current design is watching for that pattern.
  services_mutually_exclusive: true
  alternation_is_unmonitored_distress_signal: true

# ---------------------------------------------------------------------------
# Our design: one learned limit across both products
# ---------------------------------------------------------------------------
#   Limit(i) = min( f(PD(i)), g(LoyaltyTier(i)), h(CLV(i)), affordability(i) )
#
# `affordability` is new, and it is the guard the incumbent lacks entirely:
# never advance more than the subscriber's own recharge behaviour shows they
# can clear in a single top-up.
limit_function:
  # The PD model is a second prediction head sharing M1's feature pipeline --
  # not separate infrastructure. That is why M4 is cheap to build despite being
  # the most differentiated idea in the project.
  pd_head_shares_m1_features: true

  # Two heads, because the two products have different debt sizes and
  # different populations.
  targets:
    airtime: advance_repaid_by_next_recharge
    data: data_advance_repaid_by_next_recharge

  # There is no published grace period, so the label horizon is behavioural:
  # settled by the next recharge, censored at 14 days.
  label_horizon_days: 14
  censor_at_days: 14

  # --- f(PD): airtime advance. Constrained to the operator's real
  #     denominations -- we cannot invent a 2 LYD advance.
  #
  #     Note the asymmetry with the data advance: a 1 or 3 LYD airtime advance
  #     leaves 4 or 2 LYD of change off the smallest card, so clearing it still
  #     buys the subscriber something. Only the 5 LYD rung reproduces the
  #     zero-residual problem. That is a reason to prefer the small rungs, and
  #     the PD bands below are ordered accordingly.
  airtime:
    available_denominations_lyd: [1, 3, 5]
    pd_to_limit_lyd:
      - { min_pd: 0.85, limit_lyd: 5 }
      - { min_pd: 0.65, limit_lyd: 3 }
      - { min_pd: 0.45, limit_lyd: 1 }
      - { min_pd: 0.00, limit_lyd: 0 }   # below 0.45 PD: decline

  # --- Data advance. The product is flat 5 LYD / 2 GB, so the only decision
  #     available is grant or decline. That makes the PD threshold the entire
  #     model -- and it has to be stricter, because 5 LYD consumes the whole of
  #     the smallest recharge card and returns the subscriber to zero.
  data:
    price_lyd: 5.0
    data_gb: 2
    validity_days: 3
    grant_if_pd_above: 0.70
    # If declined, offer the cheapest real alternative instead of nothing.
    # 0.5 LYD for 50 MB is affordable where 5 LYD is not.
    fallback_offer_id: DAY_50MB

  tier_ceiling_lyd:
    bronze:   1
    silver:   3
    gold:     5
    platinum: 5      # capped by the product, not by policy

  max_fraction_of_clv: 0.05
  cap_regulatory_lyd: 5     # the largest advance the operator actually offers

# ---------------------------------------------------------------------------
# Mandatory safety guards
# ---------------------------------------------------------------------------
safety_guards:

  # NEW, and the most important one for this operator. Never advance more than
  # the subscriber's own recharge history shows they can clear in one top-up.
  # A 5 LYD debt against a habitual 3 LYD recharger is a trap, not a service.
  affordability_ceiling:
    enabled: true
    mandatory: true
    # Use the subscriber's modal recharge, not their mean -- the mean is
    # dragged up by one salary-week top-up they will not repeat.
    basis: modal_recharge_amount_lyd
    max_debt_as_fraction_of_modal_recharge: 1.0
    # Hard floor: never issue a debt larger than the smallest card sold.
    never_exceed_smallest_denomination: false   # set true for the strictest policy
    smallest_denomination_lyd: 3

  # Excluded regardless of PD. Repeated advancing to the most financially
  # stressed subscribers is how digital credit has gone wrong elsewhere.
  chronic_distress_exclusion:
    enabled: true
    mandatory: true
    signals:
      balance_zero_hours_30d_above: 200
      failed_bundle_attempts_30d_above: 8
      consecutive_sub_5_lyd_recharges_above: 6
      declining_recharge_trend_months: 3
      # Almadar-specific: alternating between the two emergency products is
      # sustained distress the incumbent design cannot see.
      emergency_service_alternations_90d_above: 4
      combined_advance_count_90d_above: 12
    require_sustained_months: 2

  cooling_off:
    enabled: true
    mandatory: true
    # The operator permits repeat subscription the same day once the debt is
    # cleared. We do not. Same-day re-borrowing after a same-day repayment is
    # a revolving-credit pattern, and this product is not a credit line.
    min_days_between_advances: 1
    max_advances_per_month: 8
    max_cumulative_exposure_per_month_lyd: 20
    override_operator_same_day_repeat: true

  clv_bounded_exposure:
    enabled: true
    mandatory: true
    max_fraction_of_clv: 0.05

  # Replaces the Libyana line-reset guard, which does not apply here. What we
  # CAN measure for Almadar is lockout: unpaid debt blocks re-subscription, so
  # a subscriber who cannot clear it loses access to the service entirely --
  # and a subscriber locked out of emergency credit is a churn risk.
  lockout_risk:
    enabled: true
    mandatory: true
    flag_if_probability_above: 0.15
    action_on_flag: reduce_to_next_lower_denomination
    note: >
      Probability that this advance leaves an unpaid debt at day 14, which
      blocks re-subscription. Not the same as the Libyana line-reset outcome
      and must not be described as such.

  # No fee is documented for either Almadar product -- both appear to recover
  # only the principal. If that changes, our design models any fee as a FIXED
  # charge, never time- or percentage-based, and flags it for Shariah review.
  fee_structure:
    type: fixed_charge
    forbid_time_based: true
    forbid_percentage_based: true
    amount_lyd: 0.0
    observed_operator_fee: none_documented
    status: FLAGGED_FOR_SHARIAH_REVIEW

  # Repayment is only observed for subscribers who were granted an advance,
  # and here the grant gate is "balance <= 0.5 LYD" -- so the training
  # population is filtered on being broke. The selection bias is sharper than
  # in a normal credit setting and the report must say so.
  reject_inference:
    enabled: true
    method: fuzzy_augmentation
    document_in_model_card: true
    note: "Gate is balance-based, so the observed population is non-random by construction."

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  primary_metric: pr_auc
  also_report: [brier, roc_auc, calibration_curve]
  forbid_accuracy_as_headline: true

  # What we actually care about. Note these are measurable in the generated
  # data and defensible for THIS operator -- unlike prevented line resets.
  business_metrics:
    - unclearable_debts_avoided          # debt > modal recharge
    - service_lockouts_avoided           # unpaid at day 14 blocks re-subscription
    - distress_alternations_interrupted  # caught ping-ponging between products
    - lyd_recovered_per_month
