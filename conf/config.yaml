# ---------------------------------------------------------------------------
# Root configuration. Everything else is composed from here.
#
# Rule: any threshold, weight or boundary an evaluator might ask us to change
# live must be in a YAML file, never hard-coded in Python.
# ---------------------------------------------------------------------------

project:
  name: ai-cvm-suite
  version: "0.1.0"
  market:
    country: Libya
    currency: LYD
    mcc: 606
    # This project models ALMADAR. Libyana is the competitor that
    # dual-SIM leakage flows toward; we do not price their catalogue.
    operator:   { mnc: "01", name: Almadar Aljadid, name_ar: "المدار الجديد" }
    competitor: { mnc: "00", name: Libyana, name_ar: "ليبيانا" }

# Every stochastic step reads this. Reproducibility is a deliverable.
seed: 606

paths:
  data:       ./data
  raw:        ./data/raw
  external:   ./data/external
  interim:    ./data/interim
  processed:  ./data/processed
  synthetic:  ./data/synthetic
  artifacts:  ./artifacts
  models:     ./artifacts/models
  reports:    ./artifacts/reports

feature_store:
  offline_features:  ./data/processed/features_offline.parquet
  online:            ./data/processed/features_online.duckdb
  partition_by:      snapshot_date

mlflow:
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,http://localhost:5000}
  experiment:   ai-cvm-suite
  # Log every run. An untracked experiment did not happen.
  autolog: true

privacy:
  # SHA-256 + salt at ingestion. No raw MSISDN exists anywhere in this repo.
  hash_algorithm: sha256
  salt_env_var: CVM_HASH_SALT
  id_column: subscriber_id_hashed
  forbid_raw_identifiers: true

api:
  host: 0.0.0.0
  port: 8000
  # Tabular endpoints only. The text endpoint has a looser budget, stated
  # honestly rather than hidden behind one headline number.
  latency_slo_p95_ms: 200
  batch_max_rows: 10000

# The other config files, loaded on demand by cvm.config.load_conf(name).
# Listed here so there is one place to see the full set, and so a new file
# added without being registered shows up as an omission in review.
configs:
  - data
  - features
  - pricing
  - advance
  - market
  - catalogue
  - models/m1_churn
  - models/m2_value
  - models/m3_uplift
