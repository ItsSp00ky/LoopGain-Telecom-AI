# ---------------------------------------------------------------------------
# Layer 3 — feature store and the prepaid-adapted RFM             (Owner: E1)
# ---------------------------------------------------------------------------

# --- Temporal framing. Shared by M1 both arms and the M4 PD head. ----------
# 90-day observation -> 15-day gap -> 30-day outcome.
windows:
  observation_days: 90
  gap_days: 15
  outcome_days: 30
  rolling: [7, 30, 90]

# --- Target definition -----------------------------------------------------
# In postpaid, churn is a signed cancellation. Here it is an absence.
target:
  name: silent_churn_30d
  definition: >
    Zero revenue-generating events (top-up or bundle purchase) for at least 30
    consecutive days within the prediction window. Usage alone does not count:
    a subscriber burning residual credit generates no revenue.
  min_consecutive_zero_revenue_days: 30

# --- Leakage controls. Enforced by tests/leakage/, required in CI. ---------
leakage_controls:
  # Features are computed over a window ending strictly before the label
  # window opens.
  enforce_point_in_time: true
  # Temporal splits, never random.
  split_strategy: temporal
  forbid_random_split: true
  # Label ARTIFACTS are excluded outright -- anything that lets a model
  # reconstruct the outcome directly. Must stay a superset of
  # cvm.synthesis.hazard.LABEL_ARTIFACT_FIELDS; tests/leakage/ fails if it
  # drifts.
  #
  # Label DRIVERS (days_since_last_topup, recharge_gap_cv, ...) are NOT
  # excluded, deliberately. The hazard is built from observable behaviour so
  # the signal is recoverable; a model that can see no driver of the label has
  # nothing to learn. See hazard.py for why that is honest rather than
  # circular, and say so in the report.
  exclude_label_artifacts: true
  excluded_columns:
    - "Customer Value"          # UCI: partially encodes the outcome
    - hazard_score              # our own label generator's output
    - churn_date
    - silent_churn_30d          # the label itself
    - days_to_churn
    - snapshot_date             # partition key; would leak the split

# --- Prepaid-adapted RFM-LE ------------------------------------------------
# Textbook RFM assumes purchase transactions. Prepaid has none, so each
# dimension is redefined and two are added.
rfm_le:
  quintiles: 5
  dimensions:
    recency:
      definition: days_since_last_revenue_generating_event
      note: "Usage alone does not count. Residual-credit burn is not revenue."
    frequency:
      definition: recharge_count_90d
      penalised_by: recharge_gap_cv
      note: "Five regular recharges beat five erratic ones."
    monetary:
      definition: total_lyd_90d
      plus_slope: mean_30d_vs_prior_60d
      note: "Decline is visible inside the score itself."
    loyalty:                      # added
      formula: "0.4*tenure_scaled + 0.3*consecutive_active_months_scaled + 0.3*lifetime_recharge_percentile"
      weights: { tenure: 0.4, consecutive_active_months: 0.3, lifetime_recharge_percentile: 0.3 }
    engagement:                   # added
      definition: distinct_service_types_used_normalised
      service_types: [voice, sms, data, bundles, transfers, advances]
  segments:
    - Champions
    - Loyal High-Value
    - Potential Loyalists
    - Promising New
    - Needs Attention
    - At-Risk Valuable
    - Hibernating
    - Lost

# --- Derived feature families ---------------------------------------------
families:

  velocity_decay:
    # Values well below 1.0 are the earliest reliable tell.
    revenue_decay_ratio: "mean_7d / mean_30d"
    also_for: [data, voice, sms]
    # GROUNDED: Cell2Cell's avg3mou/avg6mou gives a real two-horizon decay
    # ratio -- median 1.012, p10 0.663, p90 1.314, and 46.8% of subscribers
    # below 1.0. Nearly half a real base is declining at any moment, which is
    # a useful sanity bound on how much decline the generator should produce.
    baseline_source: cell2cell
    baseline_share_declining: 0.468

  volatility:
    - inter_recharge_gap_std
    - recharge_gap_cv
    - daily_data_rolling_variance

  # Weekly rhythm. Just the flag and what derives from it -- no usage
  # multiplier anywhere. Libya's weekend is Friday-Saturday.
  calendar:
    - is_weekend
    - weekend_usage_share_30d        # derived, not imposed
    - is_salary_week

  ratios_mix:
    - onnet_ratio
    # GROUNDED: Cell2Cell splits peak and off-peak minutes
    # (mou_peav_Mean / mou_opkv_Mean, 0% null). Measured off-peak share:
    #   median 0.424 | p10 0.149 | p90 0.715
    - offpeak_data_ratio        # share of data used 06:00-11:00
    - data_to_voice_ratio
    # PAYG data runs ~25x the bundle rate (0.025 LYD/MB vs ~0.001 LYD/MB on a
    # monthly bundle). A subscriber on PAYG data is either unaware of bundles
    # or cannot afford one up front -- two different problems needing two
    # different offers, so this is a targeting feature, not just a ratio.
    - bundle_vs_payg_share
    - payg_data_spend_lyd_30d

  distress:
    - balance_zero_hours_30d          # no postpaid equivalent exists
    - failed_bundle_attempts_30d      # pure affordability signal
    - bundle_downgrades_90d
    - consecutive_sub_5_lyd_recharges

  # Dual-SIM share-of-wallet leakage. "Active" misleads: a subscriber can stay
  # technically active while 80% of their spend has moved.
  #
  # GROUNDED, not invented. Cell2Cell carries recv_vce_Mean and plcd_vce_Mean
  # separately, 0% null across 100,000 rows, giving a measured baseline:
  #   median 0.280 | p10 0.052 | p90 0.681 | 3.0% above 1.0
  #
  # Read that 3.0% carefully. It is a single-SIM postpaid market, so it is the
  # baseline to DEVIATE from -- at 85% dual-SIM penetration the generated
  # right tail must be far fatter. The measured shape tells us where to start;
  # the overlay supplies the dual-SIM behaviour on top.
  leakage:
    primary_detector: incoming_outgoing_ratio
    baseline_source: cell2cell          # recv_vce_Mean / plcd_vce_Mean
    baseline_median: 0.280
    baseline_share_above_one: 0.030
    # In the source data this ratio does NOT separate churners (0.282 vs
    # 0.278). Expected: the hypothesis is dual-SIM-prepaid-specific and there
    # is no receiving-SIM behaviour in a single-SIM market. The source grounds
    # the DISTRIBUTION, not the predictive power. Say so in the report.
    predictive_power_validated: false
    note: >
      Incoming-call volume holding steady while outgoing volume and off-net
      share both rise means the subscriber has quietly made this their
      RECEIVING SIM. Conventional churn models score them as retained; in
      revenue terms they are half-lost.
    features:
      - incoming_outgoing_ratio_trend
      - onnet_ratio_trend
      - offnet_share_trend
      - distinct_called_numbers_trend   # calling-graph contraction precedes exit
    # Deliberately NOT here: any SMS on/off-net mix feature. Almadar charges
    # 0.050 LYD either way, so SMS carries no pricing signal and an SMS-based
    # leakage ratio would be noise dressed as insight. Voice does carry it.
    excluded_by_design:
      - sms_onnet_offnet_mix

  # Both Almadar emergency-credit products. Eligibility for each is
  # balance-based, so these features double as distress signals.
  credit:
    - airtime_advance_count_90d        # رصيد في وقته
    - data_advance_count_90d           # نت في وقته
    - days_to_settle
    - unpaid_advance_days
    - emergency_service_alternations_90d
    - modal_recharge_amount_lyd        # the affordability ceiling basis

  # Network quality, SUBSCRIBER-LEVEL. No cells, no geography, no join.
  #
  # These are real measured features, not invented Libyan ones: UCI Iranian
  # has a `Call Failures` column (one of the reasons it anchors this project)
  # and Cell2Cell has dropvce / blckvce / unansvce. "How bad is this
  # subscriber's service" is a churn predictor with data behind it.
  #
  # There is no network model here -- that is Component 2's job. When it
  # lands it supplies better values for the same field names and nothing in
  # M1 changes. The cell -> subscriber join belongs on their side, where the
  # cell data lives. Contract: docs/INTEGRATION.md section 6.
  network_quality:
    level: subscriber
    source: generated          # generated | external
    external_endpoint: null    # e.g. http://network-ml:8100/v1/subscribers/quality
    fields:
      - dropped_call_rate_30d
      - data_session_failure_rate
      - service_outage_hours_30d

# --- Class imbalance -------------------------------------------------------
imbalance:
  # Class weighting first; SMOTE/ADASYN as a documented comparison applied
  # INSIDE CV folds, never before the split.
  primary: class_weight
  comparison_arms: [smote, adasyn]
  resample_inside_cv_folds_only: true
