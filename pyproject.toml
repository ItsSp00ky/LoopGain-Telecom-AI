[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cvm-suite"
version = "0.1.0"
description = "AI Customer Value Management (CVM) for prepaid telecom — ali_branch of the Samsung Innovation Campus Libya 2026 capstone"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
keywords = ["telecom", "churn", "prepaid", "cvm", "uplift", "libya"]

# --- Core: everything the API and feature store need. CPU-only, small. -----
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26,<2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandera>=0.20",
    # Dataset C ships as .xlsx, so pandas needs an Excel engine. Undeclared
    # until the IBM loader was written, at which point read_excel raised.
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "joblib>=1.4",
    "apscheduler>=3.10",
]

[project.optional-dependencies]

# --- Classical ML: survival, CLV, optimisation -----------------------------
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.4",
    "xgboost>=2.1",
    "catboost>=1.2",
    "imbalanced-learn>=0.12",
    "lifelines>=0.28",
    "scikit-survival>=0.23",
    "lifetimes>=0.11.3",
    # M3 is the centre of the pipeline; its library belongs in the core ML
    # extra, not in a comment in the proposal.
    "scikit-uplift>=0.5.1",
    "shap>=0.45",
    "optuna>=3.6",
    "pulp>=2.8",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

# --- Synthesis: CTGAN / TVAE / Copula --------------------------------------
# Pulls torch. Install the CPU wheel first or it drags ~2.5 GB of CUDA:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
gan = [
    "sdv>=1.15",
    "sdmetrics>=0.14",
    "ctgan>=0.10",
    "faker>=25.0",
]

# --- Arabic right-to-left rendering ----------------------------------------
# Two small pure-Python packages, nothing more. There is no NLP model in this
# branch: no transformers, no peft, no CAMeL Tools, no LangChain. These exist
# only so the channel simulator renders offer copy correctly -- Streamlit and
# matplotlib both draw unreshaped Arabic backwards and disconnected.
rtl = [
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4.2",
]

# --- Layer 7: Streamlit surfaces -------------------------------------------
ui = [
    "streamlit>=1.36",
    "plotly>=5.22",
    "altair>=5.3",
    "folium>=0.17",
    "streamlit-folium>=0.21",
    "pydeck>=0.9",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

# --- Layer 8: MLOps and quality -------------------------------------------
mlops = [
    "mlflow>=2.14",
    "evidently>=0.4.25",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.4",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "locust>=2.29",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

# Everything this branch needs locally. CI installs narrower slices.
all = [
    "ai-cvm-suite[ml,gan,rtl,ui,mlops,dev]",
]

[project.scripts]
cvm = "cvm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvm = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "apps", "scripts"]
extend-exclude = ["notebooks", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = [
    "E501",    # line length is black's job
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "N803",    # ML convention: X, y, X_train
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101"]
"apps/**" = ["N999"]            # Streamlit pages are named 1_Executive_Overview.py

# A FastAPI handler's parameters ARE the request contract: even one the body
# never reads still drives validation, the 422 response and the OpenAPI schema.
# Deleting it to satisfy ARG001 would change the API. Starlette's exception
# handlers take (request, exc) by signature for the same reason.
"src/cvm/api/main.py" = ["ARG001"]
"src/cvm/api/routers/**" = ["ARG001"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "notebooks/"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=cvm --cov-report=term-missing"
markers = [
    "slow: takes more than ~5s (excluded from the fast CI gate)",
    "integration: needs the API or feature store running",
    "guardrail: asserts a commercial or credit-safety invariant. Never skip these.",
    "leakage: asserts point-in-time correctness. Never skip these either.",
]

[tool.coverage.run]
source = ["src/cvm"]
omit = ["*/__init__.py", "*/cli.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
