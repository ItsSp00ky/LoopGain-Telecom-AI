# ---------------------------------------------------------------------------
# AI CVM Suite (ali_branch) — CVM stack only. CPU-only, under 3 GB RAM.
#
#   docker compose up            # everything in this branch
#   docker compose up api ui     # just the demo path
#
# Four services: api, ui, channel-sim, mlflow. The Employee Copilot and the
# Customer Chatbot are separate components owned by other team members; they
# consume this stack's API read-only and are not started here.
# See docs/INTEGRATION.md.
#
# Deliverable D1: this must reproduce the system from a clean clone. The
# models are NOT trained in the container -- they are produced by the
# pipeline and mounted from ./artifacts/models, so `up` is seconds and not
# forty minutes. /health reports degraded until they are there.
# ---------------------------------------------------------------------------

name: cvm-ali-branch

x-common-env: &common-env
  CVM_ENV: ${CVM_ENV:-demo}
  CVM_LOG_LEVEL: ${CVM_LOG_LEVEL:-INFO}
  CVM_RANDOM_SEED: ${CVM_RANDOM_SEED:-606}
  CVM_HASH_SALT: ${CVM_HASH_SALT:?set CVM_HASH_SALT in .env}
  CVM_DATA_DIR: /app/data
  CVM_ARTIFACT_DIR: /app/artifacts
  CVM_FEATURE_STORE: /app/data/processed/features_online.duckdb
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:

  # --- Layer 6: prediction & decision API ---------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: cvm-api
    environment:
      <<: *common-env
      CVM_API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./conf:/app/conf:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      mlflow:
        condition: service_started
    restart: unless-stopped

  # --- Layer 7a: CVM Command Center ---------------------------------------
  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: cvm-ui
    command: >
      streamlit run apps/command_center/Home.py
      --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    environment:
      <<: *common-env
      CVM_API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      # NOT read-only, and the reason is a requirement rather than a
      # convenience. This surface calls the decision engine IN-PROCESS -- that
      # is the deliberate trade in ui.Dockerfile, so the dashboard survives the
      # API being down -- and every pricing and advance decision must be logged
      # with its inputs, weights, constraints and reason codes, replayably.
      # With `:ro` the offer panel died on `[Errno 30] Read-only file system`
      # while writing data/processed/decision_log.jsonl. A surface that makes
      # decisions it cannot record is the one thing this system may not ship.
      - ./data:/app/data
      - ./artifacts:/app/artifacts:ro
      - ./conf:/app/conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # --- Layer 7b: subscriber channel simulator (USSD + SMS, Arabic RTL) -----
  channel-sim:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: cvm-channel-sim
    command: >
      streamlit run apps/channel_sim/Home.py
      --server.port=8502 --server.address=0.0.0.0 --server.headless=true
    environment:
      <<: *common-env
      CVM_API_URL: http://api:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      # The healthcheck below polls this; without it the check hits 8501 and
      # the container is marked unhealthy while serving perfectly on 8502.
      STREAMLIT_SERVER_PORT: 8502
    ports:
      - "8502:8502"
    volumes:
      # The simulator reads the feature store and the model artefacts, not just
      # the config: it shows the offer and advance THIS subscriber would get,
      # which means calling the decision engine with their real features.
      # Mounting only ./conf made every lookup report "not in the feature
      # store", which looks like a data problem and is a compose problem.
      # Writable for the same reason as `ui`: the simulator shows the offer and
      # advance THIS subscriber would get, which means a real decision, which
      # means a logged decision.
      - ./data:/app/data
      - ./artifacts:/app/artifacts:ro
      - ./conf:/app/conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8502/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # --- Layer 8: experiment tracking & model registry -----------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: cvm-mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-store:/mlflow
    restart: unless-stopped

volumes:
  mlflow-store:
