[project]
name = "prepaid-churn"
version = "0.1.0"
description = "Churn risk model for prepaid telecom subscribers - Team Loop Gain (Samsung Innovation Campus Capstone)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "lightgbm",
    "matplotlib",
    "numpy",
    "pandas",
    "pandera",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "streamlit",
    "uvicorn",
]

[project.scripts]
churn = "prepaid_churn.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]
# T12, the graded sequence experiment. Installed only with
# `uv sync --group experiments`, so the module a teammate clones stays small.
# SDV (T13) is deliberately not here: it caps pandas below 3 and would downgrade the
# whole project, so it runs in its own environment (decision 27).
experiments = [
    "keras",
    "torch",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
