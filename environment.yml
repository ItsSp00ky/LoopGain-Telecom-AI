# ---------------------------------------------------------------------------
# Conda environment for the AI CVM Suite.
#
#   conda env create -f environment.yml
#   conda activate cvm
#   pip install -e ".[all]"
#
# Why conda: the proposal pins Python 3.11 and several scientific wheels
# (scikit-survival, pyarrow, lightgbm) build far more reliably from
# conda-forge on Windows than from PyPI source.
#
# Note on torch: SDV/CTGAN pulls it. Install the CPU-only wheel BEFORE
# `pip install -e ".[all]"` unless you want ~2.5 GB of unused CUDA runtime:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
# ---------------------------------------------------------------------------
name: cvm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24.0
  # Built from conda-forge because the Windows PyPI story is painful
  - numpy>=1.26,<2.2
  - pandas>=2.2
  - pyarrow>=16.0
  - scipy>=1.13
  # Pinned to a minor series: the model artefacts are sklearn pickles, and
  # sklearn does not guarantee they load into the next minor version.
  - scikit-learn>=1.7,<1.8
  - lightgbm>=4.4
  - duckdb>=1.0
  - polars>=1.0
  # Everything else, including the project itself, comes from pip
  - pip:
      - -e .[all]
