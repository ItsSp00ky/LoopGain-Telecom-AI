# The one theme both assistants share: the Loop Gain palette of the team's GIS demo page
# (antenna_cell_placement/integrated_release/index.html). Both apps run from this folder,
# so this file styles the chatbot and the copilot alike (decision 54).

[theme]
base = "light"
primaryColor = "#075a93"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#e9f2f7"
textColor = "#183042"
linkColor = "#075a93"
borderColor = "#d5dee6"
font = "system-ui, 'Segoe UI', sans-serif"
baseRadius = "8px"
orangeColor = "#c35419"
orangeBackgroundColor = "#fff6ed"

[theme.sidebar]
backgroundColor = "#f2f5f8"
secondaryBackgroundColor = "#e9f2f7"

[client]
toolbarMode = "minimal"

# Answer only on this computer: the apps hold a Groq key and a service key.
[server]
address = "127.0.0.1"

[browser]
gatherUsageStats = false
